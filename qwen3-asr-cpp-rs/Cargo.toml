[package]
name = "qwen3-asr-cpp-rs"
version = "0.1.0"
edition = "2024"
description = "Rust bindings for qwen3-asr.cpp (GGML ASR)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
ggml-aio-sys = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
cuda = ["ggml-aio-sys/cuda"]
hipblas = ["ggml-aio-sys/hipblas"]
metal = ["ggml-aio-sys/metal"]
vulkan = ["ggml-aio-sys/vulkan"]
openmp = ["ggml-aio-sys/openmp"]

[package.metadata.docs.rs]
no-default-features = true
features = []
